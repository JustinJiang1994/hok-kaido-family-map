<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img"><title>比“北海道”这个名字更久的历史</title><rect width="640" height="420" rx="20" fill="#f6eadb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="53" font-size="24" fill="#995533" font-weight="650">02 / 历史</text><text x="36" y="105" font-size="35" fill="#995533" font-weight="750">从早期文化到近代城市</text><path d="M70 180V350" stroke="#995533" stroke-width="5"/><circle cx="70" cy="180" r="10" fill="#995533"/><text x="110" y="190" font-size="32" fill="#995533" font-weight="650">1869 · 定名北海道</text><circle cx="70" cy="255" r="10" fill="#995533"/><text x="110" y="265" font-size="32" fill="#995533" font-weight="650">1876 · 札幌农学校</text><circle cx="70" cy="330" r="10" fill="#995533"/><text x="110" y="340" font-size="32" fill="#995533" font-weight="650">1878 · 钟楼前身落成</text><text x="36" y="400" font-size="18" fill="#995533" font-weight="500">北海道读本 · 原创信息图</text></g></svg>