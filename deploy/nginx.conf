server {
    listen 80;
    server_name 120.26.54.152;
    charset utf-8;
    location = /hokkaido { return 301 /hokkaido/; }
    location = /hokkaido/index.html { return 301 /hokkaido/; }
    location = /hokkaido/ {
        root /srv/hokkaido-family-map/dist;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }
    # Reserved for a future personal homepage and other services.
    location / { return 404; }
}
