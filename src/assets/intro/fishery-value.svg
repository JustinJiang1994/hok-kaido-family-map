<svg xmlns="http://www.w3.org/2000/svg" width="640" height="987" viewBox="0 0 640 987"><title>海产产出额：看看各地有多少</title><rect width="640" height="987" rx="18" fill="#eff5f0"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="50" font-size="32" fill="#193e42" font-weight="750">海产产出额：看看各地有多少</text><text x="28" y="92" font-size="23" fill="#193e42" font-weight="500">2024年 · 海面捕捞＋养殖 · 全国统一口径</text><text x="28" y="133" font-size="27" fill="#193e42" font-weight="700">全国合计 14,784.65 亿日元</text><text x="28" y="172" font-size="23" fill="#193e42" font-weight="500">逐行标出地区、数值及全国占比</text><text x="28" y="222" font-size="28" fill="#193e42" font-weight="700">北海道</text><text x="320" y="222" font-size="26" fill="#193e42" font-weight="500">2,792.98 亿日元</text><rect x="28" y="239" width="153.055" height="28" rx="4" fill="#236e67"/><text x="490" y="262" font-size="27" fill="#193e42" font-weight="700">18.9%</text><text x="28" y="314" font-size="28" fill="#193e42" font-weight="700">长崎县</text><text x="320" y="314" font-size="26" fill="#193e42" font-weight="500">1,174.13 亿日元</text><rect x="28" y="331" width="64.342" height="28" rx="4" fill="#617b99"/><text x="490" y="354" font-size="27" fill="#193e42" font-weight="700">7.9%</text><text x="28" y="406" font-size="28" fill="#193e42" font-weight="700">爱媛县</text><text x="320" y="406" font-size="26" fill="#193e42" font-weight="500">1,153.16 亿日元</text><rect x="28" y="423" width="63.193" height="28" rx="4" fill="#617b99"/><text x="490" y="446" font-size="27" fill="#193e42" font-weight="700">7.8%</text><text x="28" y="498" font-size="28" fill="#193e42" font-weight="700">宫城县</text><text x="320" y="498" font-size="26" fill="#193e42" font-weight="500">842.50 亿日元</text><rect x="28" y="515" width="46.169" height="28" rx="4" fill="#617b99"/><text x="490" y="538" font-size="27" fill="#193e42" font-weight="700">5.7%</text><text x="28" y="590" font-size="28" fill="#193e42" font-weight="700">鹿儿岛县</text><text x="320" y="590" font-size="26" fill="#193e42" font-weight="500">792.65 亿日元</text><rect x="28" y="607" width="43.437" height="28" rx="4" fill="#617b99"/><text x="490" y="630" font-size="27" fill="#193e42" font-weight="700">5.4%</text><text x="28" y="682" font-size="28" fill="#193e42" font-weight="700">未单列地区合计</text><text x="320" y="682" font-size="26" fill="#193e42" font-weight="500">8,029.23 亿日元</text><rect x="28" y="699" width="440.000" height="28" rx="4" fill="#b6c2ce"/><text x="490" y="722" font-size="27" fill="#193e42" font-weight="700">54.3%</text><text x="28" y="792" font-size="22" fill="#193e42" font-weight="500">具名地区为全国前五位。</text><text x="28" y="822" font-size="22" fill="#193e42" font-weight="500">未单列地区包括静冈、兵库、高知等。</text><text x="28" y="852" font-size="22" fill="#193e42" font-weight="500">两图口径相同，产量与金额不能视作利润。</text><text x="28" y="952" font-size="19" fill="#193e42" font-weight="500">来源：日本水产厅2024年都道府县统计表3-15</text><text x="28" y="977" font-size="19" fill="#193e42" font-weight="500">全国减去具名地区＝未单列地区；占比四舍五入。</text></g></svg>