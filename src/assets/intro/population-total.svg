<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1530" viewBox="0 0 640 1530"><title>人口相近，土地有多不同？</title><rect width="640" height="1530" rx="18" fill="#eff5f0"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="50" font-size="32" fill="#193e42" font-weight="750">人口相近，土地有多不同？</text><text x="28" y="94" font-size="28" fill="#193e42" font-weight="500">2020年10月1日 · 都道府县比较</text><text x="28" y="137" font-size="28" fill="#193e42" font-weight="700">北海道522万人，福冈514万人</text><text x="28" y="173" font-size="28" fill="#193e42" font-weight="500">北海道表列面积约为福冈的17倍</text><text x="28" y="231" font-size="32" fill="#193e42" font-weight="750">北海道</text><text x="258" y="231" font-size="32" fill="#236e67" font-weight="700">522.46 万人</text><rect x="28" y="248" width="217.20264523590302" height="38" rx="5" fill="#236e67"/><text x="28" y="319" font-size="28" fill="#193e42" font-weight="500">人口 5,224,614 人</text><text x="28" y="355" font-size="28" fill="#193e42" font-weight="500">面积 83,424.44 km²</text><text x="28" y="406" font-size="32" fill="#193e42" font-weight="750">东京都</text><text x="258" y="406" font-size="32" fill="#617b99" font-weight="700">1,404.76 万人</text><rect x="28" y="423" width="584.0" height="38" rx="5" fill="#617b99"/><text x="28" y="494" font-size="28" fill="#193e42" font-weight="500">人口 14,047,594 人</text><text x="28" y="530" font-size="28" fill="#193e42" font-weight="500">面积 2,194.03 km²</text><text x="28" y="581" font-size="32" fill="#193e42" font-weight="750">大阪府</text><text x="258" y="581" font-size="32" fill="#617b99" font-weight="700">883.77 万人</text><rect x="28" y="598" width="367.40868507446896" height="38" rx="5" fill="#617b99"/><text x="28" y="669" font-size="28" fill="#193e42" font-weight="500">人口 8,837,685 人</text><text x="28" y="705" font-size="28" fill="#193e42" font-weight="500">面积 1,905.32 km²</text><text x="28" y="756" font-size="32" fill="#193e42" font-weight="750">神奈川县</text><text x="258" y="756" font-size="32" fill="#617b99" font-weight="700">923.73 万人</text><rect x="28" y="773" width="384.0233998790113" height="38" rx="5" fill="#617b99"/><text x="28" y="844" font-size="28" fill="#193e42" font-weight="500">人口 9,237,337 人</text><text x="28" y="880" font-size="28" fill="#193e42" font-weight="500">面积 2,416.11 km²</text><text x="28" y="931" font-size="32" fill="#193e42" font-weight="750">爱知县</text><text x="258" y="931" font-size="32" fill="#617b99" font-weight="700">754.24 万人</text><rect x="28" y="948" width="313.5604830264884" height="38" rx="5" fill="#617b99"/><text x="28" y="1019" font-size="28" fill="#193e42" font-weight="500">人口 7,542,415 人</text><text x="28" y="1055" font-size="28" fill="#193e42" font-weight="500">面积 5,173.07 km²</text><text x="28" y="1106" font-size="32" fill="#193e42" font-weight="750">福冈县</text><text x="258" y="1106" font-size="32" fill="#617b99" font-weight="700">513.52 万人</text><rect x="28" y="1123" width="213.4860230157563" height="38" rx="5" fill="#617b99"/><text x="28" y="1194" font-size="28" fill="#193e42" font-weight="500">人口 5,135,214 人</text><text x="28" y="1230" font-size="28" fill="#193e42" font-weight="500">面积 4,986.51 km²</text><text x="28" y="1315" font-size="28" fill="#193e42" font-weight="500">面积为表列参考面积，非可居住面积。</text><text x="28" y="1352" font-size="28" fill="#193e42" font-weight="500">比较整个都道府县，不是市区或都市圈。</text><text x="28" y="1389" font-size="28" fill="#193e42" font-weight="500">人数按万人显示，另列原始人数。</text><text x="28" y="1455" font-size="28" fill="#193e42" font-weight="500">来源：日本统计局2020年国势调查</text><text x="28" y="1495" font-size="28" fill="#193e42" font-weight="500">人口等基本集计 · 表Ⅰ－２－１</text></g></svg>