<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img"><title>2024年北海道与日本其他地区的农业对比</title><rect width="640" height="720" rx="20" fill="#f0f5ef"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="48" font-size="32" fill="#193e42" font-weight="750">北海道的农业，占日本多少？</text><text x="28" y="87" font-size="23" fill="#193e42" font-weight="500">2024年 · 每条完整色带＝日本全国100%</text><rect x="28" y="113" width="18" height="18" rx="4" fill="#236e67"/><text x="55" y="130" font-size="23" fill="#193e42" font-weight="500">北海道</text><rect x="180" y="113" width="18" height="18" rx="4" fill="#c8d5e4"/><text x="207" y="130" font-size="23" fill="#193e42" font-weight="500">其余46个都府县合计</text><text x="28" y="185" font-size="30" fill="#193e42" font-weight="700">耕地面积</text><text x="28" y="227" font-size="26" fill="#193e42" font-weight="500">北海道 113.8万公顷</text><rect x="28" y="249" width="584" height="40" rx="6" fill="#c8d5e4"/><rect x="28" y="249" width="155.34400000000002" height="40" fill="#236e67"/><text x="28" y="330" font-size="30" fill="#236e67" font-weight="750">北海道 26.6%</text><text x="300" y="330" font-size="27" fill="#193e42" font-weight="500">其他地区 73.4%</text><text x="28" y="370" font-size="25" fill="#193e42" font-weight="500">全国每100份耕地，约27份在北海道。</text><text x="28" y="410" font-size="30" fill="#193e42" font-weight="700">农业产出额</text><text x="28" y="452" font-size="26" fill="#193e42" font-weight="500">北海道 1兆4,817亿日元</text><rect x="28" y="474" width="584" height="40" rx="6" fill="#c8d5e4"/><rect x="28" y="474" width="80.008" height="40" fill="#236e67"/><text x="28" y="555" font-size="30" fill="#236e67" font-weight="750">北海道 13.7%</text><text x="300" y="555" font-size="27" fill="#193e42" font-weight="500">其他地区 86.3%</text><text x="28" y="595" font-size="25" fill="#193e42" font-weight="500">全国每100份农业产出，约14份来自北海道。</text><text x="28" y="650" font-size="23" fill="#193e42" font-weight="500">两项指标分别比较，不代表土地生产效率。</text><text x="28" y="684" font-size="20" fill="#193e42" font-weight="500">来源：北海道政府《数据册2026·农业》</text><text x="28" y="710" font-size="18" fill="#193e42" font-weight="500">其他地区占比＝100%－北海道占比（按公布数计算）</text></g></svg>