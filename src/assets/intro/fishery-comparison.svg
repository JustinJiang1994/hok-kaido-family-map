<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650"><title>日本的海产，北海道占多少？</title><rect width="640" height="650" rx="18" fill="#eff5f0"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="50" font-size="32" fill="#193e42" font-weight="750">日本的海产，北海道占多少？</text><text x="28" y="94" font-size="23" fill="#193e42" font-weight="500">2024年 · 海面渔业及养殖业（属地统计）</text><text x="28" y="155" font-size="29" fill="#193e42" font-weight="700">产量 · 北海道111万吨</text><rect x="28" y="185" width="584" height="38" rx="5" fill="#c8d5e4"/><rect x="28" y="185" width="180.456" height="38" rx="5" fill="#236e67"/><text x="28" y="267" font-size="29" fill="#236e67" font-weight="750">北海道 30.9%</text><text x="310" y="267" font-size="27" fill="#193e42" font-weight="500">其他地区 69.1%</text><text x="28" y="311" font-size="23" fill="#193e42" font-weight="500">整条色带＝日本全国100%</text><text x="28" y="355" font-size="29" fill="#193e42" font-weight="700">产值 · 北海道2,856亿日元</text><rect x="28" y="385" width="584" height="38" rx="5" fill="#c8d5e4"/><rect x="28" y="385" width="112.712" height="38" rx="5" fill="#236e67"/><text x="28" y="467" font-size="29" fill="#236e67" font-weight="750">北海道 19.3%</text><text x="310" y="467" font-size="27" fill="#193e42" font-weight="500">其他地区 80.7%</text><text x="28" y="511" font-size="23" fill="#193e42" font-weight="500">整条色带＝日本全国100%</text><text x="28" y="565" font-size="24" fill="#193e42" font-weight="500">重量与金额分别比较，不等同于利润。</text><text x="28" y="606" font-size="20" fill="#193e42" font-weight="500">来源：北海道政府《数据册2026·水产业》</text><text x="28" y="636" font-size="20" fill="#193e42" font-weight="500">其他地区＝全国占比100%减去北海道占比</text></g></svg>