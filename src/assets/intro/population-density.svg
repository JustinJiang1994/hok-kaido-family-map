<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120"><title>同样1平方公里，住多少人？</title><rect width="640" height="1120" rx="18" fill="#eff5f0"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="50" font-size="32" fill="#193e42" font-weight="750">同样1平方公里，住多少人？</text><text x="28" y="94" font-size="24" fill="#193e42" font-weight="500">2020年10月1日 · 都道府县比较</text><text x="28" y="137" font-size="28" fill="#193e42" font-weight="700">东京约为北海道的96倍密度</text><text x="28" y="173" font-size="25" fill="#193e42" font-weight="500">大阪约为北海道的70倍密度</text><text x="28" y="231" font-size="29" fill="#193e42" font-weight="750">北海道</text><text x="258" y="231" font-size="28" fill="#236e67" font-weight="700">66.6 人/km²</text><rect x="28" y="248" width="6.074782119763845" height="38" rx="5" fill="#236e67"/><text x="28" y="314" font-size="21" fill="#193e42" font-weight="500">约为北海道的 1.0 倍密度</text><text x="28" y="356" font-size="29" fill="#193e42" font-weight="750">东京都</text><text x="258" y="356" font-size="28" fill="#617b99" font-weight="700">6,402.6 人/km²</text><rect x="28" y="373" width="584.0" height="38" rx="5" fill="#617b99"/><text x="28" y="439" font-size="21" fill="#193e42" font-weight="500">约为北海道的 96.1 倍密度</text><text x="28" y="481" font-size="29" fill="#193e42" font-weight="750">大阪府</text><text x="258" y="481" font-size="28" fill="#617b99" font-weight="700">4,638.4 人/km²</text><rect x="28" y="498" width="423.0821228875768" height="38" rx="5" fill="#617b99"/><text x="28" y="564" font-size="21" fill="#193e42" font-weight="500">约为北海道的 69.6 倍密度</text><text x="28" y="606" font-size="29" fill="#193e42" font-weight="750">神奈川县</text><text x="258" y="606" font-size="28" fill="#617b99" font-weight="700">3,823.2 人/km²</text><rect x="28" y="623" width="348.72533033455153" height="38" rx="5" fill="#617b99"/><text x="28" y="689" font-size="21" fill="#193e42" font-weight="500">约为北海道的 57.4 倍密度</text><text x="28" y="731" font-size="29" fill="#193e42" font-weight="750">爱知县</text><text x="258" y="731" font-size="28" fill="#617b99" font-weight="700">1,458.0 人/km²</text><rect x="28" y="748" width="132.98847343266797" height="38" rx="5" fill="#617b99"/><text x="28" y="814" font-size="21" fill="#193e42" font-weight="500">约为北海道的 21.9 倍密度</text><text x="28" y="856" font-size="29" fill="#193e42" font-weight="750">福冈县</text><text x="258" y="856" font-size="28" fill="#617b99" font-weight="700">1,029.8 人/km²</text><rect x="28" y="873" width="93.9310904944866" height="38" rx="5" fill="#617b99"/><text x="28" y="939" font-size="21" fill="#193e42" font-weight="500">约为北海道的 15.5 倍密度</text><text x="28" y="1010" font-size="21" fill="#193e42" font-weight="500">各条均从0起，同一线性刻度；不是人口占比。</text><text x="28" y="1038" font-size="21" fill="#193e42" font-weight="500">密度采用官方公布值；北海道计算时扣除</text><text x="28" y="1066" font-size="21" fill="#193e42" font-weight="500">齿舞、色丹、国后、择捉面积。</text><text x="28" y="1100" font-size="20" fill="#193e42" font-weight="500">来源：日本统计局2020年国势调查 表Ⅰ－２－１</text></g></svg>