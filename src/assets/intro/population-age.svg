<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560"><title>把居民想成100个人</title><rect width="640" height="560" rx="18" fill="#eff5f0"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="50" font-size="32" fill="#193e42" font-weight="750">把居民想成100个人</text><text x="28" y="94" font-size="24" fill="#193e42" font-weight="500">2020年 · 北海道年龄构成</text><text x="28" y="150" font-size="28" fill="#193e42" font-weight="650">15岁以下</text><text x="415" y="150" font-size="32" fill="#c07336" font-weight="750">10.8%</text><rect x="28" y="170" width="584" height="38" rx="5" fill="#dce5de"/><rect x="28" y="170" width="63.07200000000001" height="38" rx="5" fill="#c07336"/><text x="28" y="270" font-size="28" fill="#193e42" font-weight="650">15—64岁</text><text x="415" y="270" font-size="32" fill="#236e67" font-weight="750">57.0%</text><rect x="28" y="290" width="584" height="38" rx="5" fill="#dce5de"/><rect x="28" y="290" width="332.88" height="38" rx="5" fill="#236e67"/><text x="28" y="390" font-size="28" fill="#193e42" font-weight="650">65岁及以上</text><text x="415" y="390" font-size="32" fill="#67528c" font-weight="750">32.2%</text><rect x="28" y="410" width="584" height="38" rx="5" fill="#dce5de"/><rect x="28" y="410" width="188.04800000000003" height="38" rx="5" fill="#67528c"/><text x="28" y="498" font-size="23" fill="#193e42" font-weight="500">每条浅色底带都表示全部人口100%。</text><text x="28" y="538" font-size="20" fill="#193e42" font-weight="500">来源：2020年国势调查／北海道政府数据册</text></g></svg>