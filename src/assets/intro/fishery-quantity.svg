<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1079" viewBox="0 0 640 1079"><title>海产产量：看看各地有多少</title><rect width="640" height="1079" rx="18" fill="#eff5f0"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="50" font-size="32" fill="#193e42" font-weight="750">海产产量：看看各地有多少</text><text x="28" y="92" font-size="23" fill="#193e42" font-weight="500">2024年 · 海面捕捞＋养殖 · 全国统一口径</text><text x="28" y="133" font-size="27" fill="#193e42" font-weight="700">全国合计 358.91 万吨</text><text x="28" y="172" font-size="23" fill="#193e42" font-weight="500">逐行标出地区、数值及全国占比</text><text x="28" y="222" font-size="28" fill="#193e42" font-weight="700">北海道</text><text x="320" y="222" font-size="26" fill="#193e42" font-weight="500">89.75 万吨</text><rect x="28" y="239" width="226.894" height="28" rx="4" fill="#236e67"/><text x="490" y="262" font-size="27" fill="#193e42" font-weight="700">25.0%</text><text x="28" y="314" font-size="28" fill="#193e42" font-weight="700">长崎县</text><text x="320" y="314" font-size="26" fill="#193e42" font-weight="500">31.97 万吨</text><rect x="28" y="331" width="80.822" height="28" rx="4" fill="#617b99"/><text x="490" y="354" font-size="27" fill="#193e42" font-weight="700">8.9%</text><text x="28" y="406" font-size="28" fill="#193e42" font-weight="700">宫城县</text><text x="320" y="406" font-size="26" fill="#193e42" font-weight="500">22.73 万吨</text><rect x="28" y="423" width="57.469" height="28" rx="4" fill="#617b99"/><text x="490" y="446" font-size="27" fill="#193e42" font-weight="700">6.3%</text><text x="28" y="498" font-size="28" fill="#193e42" font-weight="700">静冈县</text><text x="320" y="498" font-size="26" fill="#193e42" font-weight="500">16.01 万吨</text><rect x="28" y="515" width="40.462" height="28" rx="4" fill="#617b99"/><text x="490" y="538" font-size="27" fill="#193e42" font-weight="700">4.5%</text><text x="28" y="590" font-size="28" fill="#193e42" font-weight="700">爱媛县</text><text x="320" y="590" font-size="26" fill="#193e42" font-weight="500">13.03 万吨</text><rect x="28" y="607" width="32.939" height="28" rx="4" fill="#617b99"/><text x="490" y="630" font-size="27" fill="#193e42" font-weight="700">3.6%</text><text x="28" y="682" font-size="28" fill="#193e42" font-weight="700">广岛县</text><text x="320" y="682" font-size="26" fill="#193e42" font-weight="500">11.37 万吨</text><rect x="28" y="699" width="28.744" height="28" rx="4" fill="#617b99"/><text x="490" y="722" font-size="27" fill="#193e42" font-weight="700">3.2%</text><text x="28" y="774" font-size="28" fill="#193e42" font-weight="700">未单列地区合计</text><text x="320" y="774" font-size="26" fill="#193e42" font-weight="500">174.05 万吨</text><rect x="28" y="791" width="440.000" height="28" rx="4" fill="#b6c2ce"/><text x="490" y="814" font-size="27" fill="#193e42" font-weight="700">48.5%</text><text x="28" y="884" font-size="22" fill="#193e42" font-weight="500">展示6个主要地区，非完整排名。</text><text x="28" y="914" font-size="22" fill="#193e42" font-weight="500">茨城县海面合计保密，归入未单列地区；</text><text x="28" y="944" font-size="22" fill="#193e42" font-weight="500">其公开的捕捞量为23.19万吨（不含养殖）。</text><text x="28" y="1044" font-size="19" fill="#193e42" font-weight="500">来源：日本水产厅2024年都道府县统计表3-15</text><text x="28" y="1069" font-size="19" fill="#193e42" font-weight="500">全国减去具名地区＝未单列地区；占比四舍五入。</text></g></svg>