<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510"><title>同样1平方公里，住多少人？</title><rect width="640" height="510" rx="18" fill="#eff5f0"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="50" font-size="32" fill="#193e42" font-weight="750">同样1平方公里，住多少人？</text><text x="28" y="94" font-size="24" fill="#193e42" font-weight="500">2020年人口密度 · 相同刻度比较</text><text x="28" y="150" font-size="27" fill="#193e42" font-weight="700">北海道</text><text x="28" y="188" font-size="30" fill="#236e67" font-weight="700">67 人 / 平方公里</text><rect x="28" y="208" width="115.76331360946746" height="38" rx="5" fill="#236e67"/><text x="28" y="285" font-size="27" fill="#193e42" font-weight="700">日本全国（含北海道）</text><text x="28" y="323" font-size="30" fill="#9a532e" font-weight="700">338 人 / 平方公里</text><rect x="28" y="343" width="584.0" height="38" rx="5" fill="#9a532e"/><text x="28" y="430" font-size="26" fill="#193e42" font-weight="500">全国平均约为北海道的5倍。</text><text x="28" y="468" font-size="20" fill="#193e42" font-weight="500">来源：北海道政府《数据册2026·人口》</text><text x="28" y="495" font-size="20" fill="#193e42" font-weight="500">采用官方密度值，不据行政总面积重新计算。</text></g></svg>