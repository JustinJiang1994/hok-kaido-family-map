<article id="hokkaidoIntro" hidden><div class="intro-opening"><p class="intro-eyebrow">北海道读本 / HOKKAIDO</p><h2>想先了解哪一面？</h2><p>点开感兴趣的封面，慢慢读。每个主题都可以单独看。</p></div><div class="reading-covers"><button class="reading-cover" data-topic="geography" aria-haspopup="dialog"><span class="cover-picture"><img src="assets/intro/regions-zh.svg" alt="四大分区与本次目的地：札幌、新千岁机场在道央；旭川、美瑛在道北。" width="640" height="620" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="cover-name">地理</span></span><span class="cover-copy"><strong>道央、道北在哪里？四个目的地一次看懂。</strong><span>6 个章节 · 点击阅读 →</span></span></button><button class="reading-cover" data-topic="history" aria-haspopup="dialog"><span class="cover-picture"><img src="https://www.sapporo.travel/cms/wp-content/uploads/2020/10/tokeidaiMV_slide1.jpg" alt="札幌钟楼外观 · 非冬季资料图" width="1200" height="600" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="cover-name">历史</span></span><span class="cover-copy"><strong>从早期文化到近代城市，再到冬奥会与今天。</strong><span>8 个章节 · 点击阅读 →</span></span></button><button class="reading-cover" data-topic="population" aria-haspopup="dialog"><span class="cover-picture"><img src="https://www.sapporo.travel/cms/wp-content/uploads/2024/01/★眺望_夜_南３-1-scaled.jpg" alt="从JR塔展望室看札幌夜景" width="2560" height="1707" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="cover-name">人口</span></span><span class="cover-copy"><strong>为什么一路很空旷，到了札幌却很热闹？</strong><span>4 个章节 · 点击阅读 →</span></span></button><button class="reading-cover" data-topic="food" aria-haspopup="dialog"><span class="cover-picture"><img src="https://www.visit-hokkaido.jp/gourmet/images/gourmetPhoto-02.jpg" alt="北海道拉面 · 官方美食专题资料图" width="2000" height="1160" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="cover-name">美食</span></span><span class="cover-copy"><strong>不止海鲜：拉面、鲑鱼、羊肉与乳制品。</strong><span>4 个章节 · 点击阅读 →</span></span></button><button class="reading-cover" data-topic="landscapes" aria-haspopup="dialog"><span class="cover-picture"><img src="https://www.town.biei.hokkaido.jp/files/00005100/00005192/huyu_aoiike.jpg" alt="白金青池灯光 · 冬季资料图" width="753" height="500" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="cover-name">景观</span></span><span class="cover-copy"><strong>雪景背后的山岳、火山湖与农业丘陵。</strong><span>4 个章节 · 点击阅读 →</span></span></button><button class="reading-cover" data-topic="industry" aria-haspopup="dialog"><span class="cover-picture"><img src="https://www.biei-hokkaido.jp/wp3/wp-content/uploads/2023/12/IMG_7059-scaled.jpg" alt="美瑛肯与玛丽之木及周边田野 · 夏季资料图" width="2560" height="1707" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="cover-name">产业</span></span><span class="cover-copy"><strong>从一片田地，看到北海道的生产与生活。</strong><span>4 个章节 · 点击阅读 →</span></span></button><button class="reading-cover" data-topic="culture" aria-haspopup="dialog"><span class="cover-picture"><img src="https://ainu-upopoy.go.jp/wp/wp-content/uploads/2026/04/urespa.png" alt="阿伊努生活文化 · Upopoy「くらし」章节资料图" width="1166" height="722" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="cover-name">文化</span></span><span class="cover-copy"><strong>语言、手工艺与仍在延续的阿伊努文化。</strong><span>4 个章节 · 点击阅读 →</span></span></button></div><template id="reading-geography" data-title="先看四大分区，再认识这次的路线"><figure class="reading-hero"><img src="assets/intro/regions-zh.svg" alt="四大分区与本次目的地：札幌、新千岁机场在道央；旭川、美瑛在道北。" width="640" height="620" loading="lazy" decoding="async" referrerpolicy="no-referrer"><figcaption>四大分区与本次目的地：札幌、新千岁机场在道央；旭川、美瑛在道北。<small>图片：底图：北海道观光振兴机构；中文及地点标注：本项目</small></figcaption></figure><div class="reading-copy"><p class="reading-lead">道央、道北在哪里？四个目的地一次看懂。</p><section class="reading-chapter"><h3>为什么先认识分区</h3><p>北海道旅游常按道央、道南、道北、道东四个区域来认识。这里沿用北海道官方旅游网站的分法；它是旅行中常用的地理分区，不是四个独立的行政区。</p></section><section class="reading-chapter"><h3>道央：城市、湖泊与温泉</h3><p>道央｜札幌、小樽、新千岁机场所在区域，也包括洞爷湖、登别等地。城市、温泉与湖泊是认识这一区域的关键词。</p></section><section class="reading-chapter"><h3>道北：内陆丘陵与北方海岛</h3><p>道北｜包括旭川、美瑛、富良野，以及更北的稚内、利尻和礼文。既有内陆丘陵和山岳，也有最北端的海岛。</p></section><section class="reading-chapter"><h3>道南：港口与历史城镇</h3><p>道南｜以函馆及松前、江差、奥尻一带为代表，适合从港口、城镇历史和海岸景色认识北海道。</p></section><section class="reading-chapter"><h3>道东：森林、湿原与海岸</h3><p>道东｜包括十胜、带广、鄂霍次克沿岸、知床、钏路、根室及阿寒摩周一带，地域开阔，自然景观丰富。</p></section><section class="reading-chapter"><h3>这次旅行跨越哪两个区域</h3><p>这次主要往返于道央与道北：新千岁机场 → 札幌（道央）→ 旭川、美瑛（道北）→ 新千岁机场。道南和道东仅作地理背景介绍。</p></section><aside>沿用官方旅游四区划分，地点为近似位置示意，不用于导航。橙色圆点标出本次目的地。</aside><p class="reading-source">资料：北海道政府《数据册2026·地势》；北海道官方旅游网站·地区指南。核对：2026-10-15。</p><button class="reading-back-bottom">返回主题</button></div></template><template id="reading-history" data-title="北海道的历史：从古老文化走到今天"><figure class="reading-hero"><img src="https://www.sapporo.travel/cms/wp-content/uploads/2020/10/tokeidaiMV_slide1.jpg" alt="札幌钟楼外观 · 非冬季资料图" width="1200" height="600" loading="lazy" decoding="async" referrerpolicy="no-referrer"><figcaption>札幌钟楼外观 · 非冬季资料图<small>图片：札幌官方旅游网站</small></figcaption></figure><div class="reading-copy"><p class="reading-lead">从早期文化到近代城市，再到冬奥会与今天。</p><section class="reading-chapter"><h3>01｜在“北海道”这个名字出现以前</h3><p>北海道的历史并不是从1869年开始。这里经历过绳文、续绳文、鄂霍次克与擦文等文化阶段，人们通过渔猎、采集以及跨海交流生活。今天看到的海峡，过去也是人与物往来的通道。</p><p>阿伊努历史也不能简单写成某一年突然出现。Upopoy强调应把它放在从早期到现代的连续历史、以及与周边民族交流的背景中理解。语言、口传文学、工艺和信仰，都是这条历史线索的一部分。</p></section><section class="reading-chapter"><h3>02｜贸易、松前与函馆：南部的历史入口</h3><p>近世的松前藩通过与阿伊努人的贸易建立影响。交流带来了货物与技术，也伴随权力不平等和冲突；因此，北海道早期历史既有贸易，也有不同群体争取生存空间的过程。</p><p>1859年函馆成为通商港，海上联系进一步扩大。这解释了为什么道南的历史气质与札幌不太一样：前者能看到港口贸易与旧城镇的痕迹，后者更多体现近代规划城市的发展。</p></section><section class="reading-chapter"><h3>03｜1869年以后：名字、城市与土地都在改变</h3><p>1869年设立开拓使，“北海道”这一名称开始使用。农业试验、移民定居与行政建设随后推进，札幌逐渐成为新的中心。1876年札幌农学校开校，农业教育与西式技术成为近代开发的重要工具。</p><p>“开发”并非对所有人都有相同意义。明治时期的殖民与同化政策限制了阿伊努人的传统生活，社会和文化受到严重冲击。理解这段历史，需要同时看到城市和产业的建设，以及原住民族为此承受的代价。</p></section><section class="reading-chapter"><h3>04｜铁路、煤矿、港口：北海道怎样连接起来</h3><p>1880年手宫至札幌铁路开通；1888年红砖厅舍落成。铁路把资源产地、城市和港口联系起来，也改变了人们移动和物资运输的方式。红砖建筑因此不仅是拍照地点，也是行政中心成长的见证。</p><p>近代北海道的重要产业不只有农业。煤炭开采、林业和渔业同样塑造了城镇与劳动生活。博物馆里的矿工工具、伐木工具和鲱鱼加工大锅，能让人看到观光风景背后的生产历史。</p></section><section class="reading-chapter"><h3>05｜20世纪前半：普通人的生活与战争</h3><p>进入20世纪，城市生活、交通和消费逐渐变化；铁路与海运把北海道同日本其他地区联系得更紧密。不过，这并不是一条只有繁荣的直线：战争、物资紧缺和社会动员也进入普通家庭的生活。</p><p>北海道博物馆把这一时期与战后并置，提醒参观者从生活用品、照片和个人经历认识时代，而不只看宏大的发展年表。读这段历史时，要把生活改善与战争造成的伤害一同纳入视野。</p></section><section class="reading-chapter"><h3>06｜战后到1972年：雪城变成国际冬季城市</h3><p>战后，北海道继续经历基础设施建设与生活方式变化。1950年首届札幌雪祭举办，雪逐渐成为城市活动与旅游的主题，而不仅是冬天需要应付的天气。</p><p>1971年札幌地铁南北线开业，1972年札幌举办冬季奥运会。交通、体育设施和国际知名度共同改变了城市形象。今天的冬季札幌，既有积雪生活，也有以冰雪为特色的城市文化。</p></section><section class="reading-chapter"><h3>07｜1988年至今：连接、保护与文化复兴</h3><p>1988年青函隧道通车、新千岁机场开港；2016年北海道新干线的新青森至新函馆北斗段开业。进入北海道的方式不断变化，我们这次使用的新千岁机场，就是这段交通史的一部分。</p><p>2005年知床列入世界自然遗产；2020年Upopoy开放；2021年北海道与北东北的绳文遗址群列入世界文化遗产。人们关注的不再只有资源开发，也包括生态保护、古老文化的价值和阿伊努文化的传承。</p><p>今天的北海道并不是完成了发展的“风景展览馆”。人口减少、地方交通、产业转型与文化延续，都仍在影响居民生活。旅行看到的一座城市、一片田地和一间博物馆，都是这个持续变化过程的一部分。</p></section><section class="reading-chapter"><h3>08｜把历史带到这次旅行里</h3><p>到札幌钟楼时，可以想起农学校与近代教育；看红砖厅舍时，可以想起行政中心的形成；经过田园与铁路时，可以想起农业技术、资源运输和居民劳动。</p><p>不必记住所有年份。沿着“原有文化与交流 → 近代开发与社会变化 → 战后生活与冬季城市 → 当代保护与传承”这条线索，就更容易理解北海道为什么是今天的样子。</p></section><aside>配图是今天的札幌钟楼，不是1878年的历史照片。</aside><p class="reading-source">资料：北海道政府《数据册2026·历史年表》；北海道博物馆·北海道120万年物语；北海道博物馆·北海道特色的秘密；北海道博物馆·走向我们的时代；Upopoy·阿伊努文化。核对：2026-10-15。</p><button class="reading-back-bottom">返回主题</button></div></template><template id="reading-population" data-title="地广，但居民更多集中在城市"><figure class="reading-hero"><img src="https://www.sapporo.travel/cms/wp-content/uploads/2024/01/★眺望_夜_南３-1-scaled.jpg" alt="从JR塔展望室看札幌夜景" width="2560" height="1707" loading="lazy" decoding="async" referrerpolicy="no-referrer"><figcaption>从JR塔展望室看札幌夜景<small>图片：札幌官方旅游网站</small></figcaption></figure><div class="reading-copy"><p class="reading-lead">为什么一路很空旷，到了札幌却很热闹？</p><section class="reading-chapter"><h3>人口数字该怎么看</h3><p>2020年日本人口普查记录北海道人口为5,224,614人，约522.46万人。北海道政府2026年数据册的人口章节仍采用这次普查；这里明确使用2020年口径，不把它称为2026年即时人口。</p></section><section class="reading-chapter"><h3>城市集中与乡间开阔</h3><p>同一普查中，82.5%的人口住在“市部”，约431万人；65岁及以上人口占32.2%。城市之外的乡镇和农田可能显得很空旷，但札幌等城市仍有密集街区与完善商业。</p></section><section class="reading-chapter"><h3>人口变化对旅行的影响</h3><p>2015至2020年间，全道人口下降2.9%。理解人口分布，也能帮助理解为什么有些乡间景点需要提前考虑交通、营业时间和休息地点。</p></section><section class="reading-chapter"><h3>读数字，也读城市与乡村的差别</h3><p>人口总数无法直接说明旅途中会有多拥挤。同一个北海道，札幌中心街区与美瑛乡间的居住密度、商业设施和交通条件很不一样。照片中的札幌夜景代表城市集中生活的一面，不能替代全道的日常景象。</p><p>年龄比例也是全道平均，不能据此判断某个小镇或某家店的情况。对旅行更实用的理解是：城市里的选择通常集中，乡间则要留意具体地点之间的距离与服务时间。</p></section><aside>本节人口、城镇分布及年龄数据均为2020年国势调查口径；“市部”指行政上设市的地区。</aside><p class="reading-source">资料：北海道政府《数据册2026·人口与生活》（引用2020年国势调查）。核对：2026-10-15。</p><button class="reading-back-bottom">返回主题</button></div></template><template id="reading-food" data-title="从海、牧场和田地走上餐桌"><figure class="reading-hero"><img src="https://www.visit-hokkaido.jp/gourmet/images/gourmetPhoto-02.jpg" alt="北海道拉面 · 官方美食专题资料图" width="2000" height="1160" loading="lazy" decoding="async" referrerpolicy="no-referrer"><figcaption>北海道拉面 · 官方美食专题资料图<small>图片：北海道观光振兴机构 HOKKAIDO LOVE!</small></figcaption></figure><div class="reading-copy"><p class="reading-lead">不止海鲜：拉面、鲑鱼、羊肉与乳制品。</p><section class="reading-chapter"><h3>海、牧场与农田共同塑造味道</h3><p>海产、乳制品和农作物共同构成北海道的味道。寿司与海鲜之外，还能认识羊肉烤肉“成吉思汗”、鲑鱼料理、乳制甜点以及不同城市的拉面。</p></section><section class="reading-chapter"><h3>三地拉面与札幌汤咖喱</h3><p>常见的三地拉面印象是札幌味噌、旭川酱油、函馆盐味。它们是地域代表风格，不表示每家店只做一种汤底；札幌的汤咖喱也是认识当地饮食的一种方式。</p></section><section class="reading-chapter"><h3>鲑鱼料理与家庭餐桌</h3><p>石狩锅以鲑鱼、蔬菜和味噌汤为特色；“锵锵烧”则把鲑鱼与蔬菜蒸烤。对这次有长辈和小朋友的家庭，可以先记住“海鲜、面汤、熟食、奶香甜点”四种方向，再按大家喜好选具体店。</p></section><section class="reading-chapter"><h3>为什么这些食物会成为地方名片</h3><p>牛奶、马铃薯、小麦、鲑鱼等食材把牧场、旱田和海洋联系起来；加工、冷藏运输和餐馆料理又让这些原料形成可携带、可分享的地方味道。北海道美食既来自自然条件，也来自人的生产技术和饮食习惯。</p><p>看菜单时可以按料理方式认识：海鲜有生食也有熟食，拉面以汤底和配料见长，成吉思汗是羊肉烤肉，乳制品则常出现在冰淇淋、奶酪和糕点中。先知道自己想吃什么，比只记一个“必吃”标签更有帮助。</p></section><aside>配图以拉面代表北海道饮食的一部分；具体餐厅仍等待你们选定。</aside><p class="reading-source">资料：北海道官方旅游网站·美食；北海道官方旅游网站·食的乐趣；北海道官方旅游手册·三大拉面。核对：2026-10-15。</p><button class="reading-back-bottom">返回主题</button></div></template><template id="reading-landscapes" data-title="看山、看湖，也看人生活的地方"><figure class="reading-hero"><img src="https://www.town.biei.hokkaido.jp/files/00005100/00005192/huyu_aoiike.jpg" alt="白金青池灯光 · 冬季资料图" width="753" height="500" loading="lazy" decoding="async" referrerpolicy="no-referrer"><figcaption>白金青池灯光 · 冬季资料图<small>图片：美瑛町官网</small></figcaption></figure><div class="reading-copy"><p class="reading-lead">雪景背后的山岳、火山湖与农业丘陵。</p><section class="reading-chapter"><h3>山岳：大雪山的尺度</h3><p>大雪山国立公园是北海道中部的山岳地带，最高峰旭岳海拔2,291米。它代表的是高山、峡谷、温泉和高山植物组成的景观。</p></section><section class="reading-chapter"><h3>火山湖、森林与海岸</h3><p>支笏洞爷国立公园以火山、湖泊与温泉为特色；知床则把山地、森林、河川与海岸连接在一起。不同地区的景色不是同一种“北海道风景”的重复。</p></section><section class="reading-chapter"><h3>这次旅途能看到什么</h3><p>你们这次会看到另一种组合：札幌的建筑和夜景、旭山动物园的动物行为展示、美瑛的农业丘陵与青池、白须瀑布。12月的花田会进入冬季景观，青池也可能覆冰覆雪，不能按夏季照片期待现场。</p></section><section class="reading-chapter"><h3>美瑛的风景，是自然与农业共同形成的</h3><p>美瑛的起伏地形提供了远近变化，田地和道路则把地形组织成容易辨认的线条。照片里常见的“拼布”并非整片原始荒野，而是农业经营形成的景观。树木之所以显眼，也与周围开阔的土地有关。</p><p>同一处景观在夏季和冬季可能很不同：植被颜色、积雪、日照和水面状态都会改变画面。旅行前看照片，最好同时看季节说明；冬季的魅力往往是轮廓、光影和雪的层次。</p></section><aside>配图为白金青池冬季灯光资料图。大雪山、支笏洞爷、知床作为背景介绍，不代表加入本次行程。</aside><p class="reading-source">资料：北海道政府·北海道的国立公园；北海道官方旅游网站·景点。核对：2026-10-15。</p><button class="reading-back-bottom">返回主题</button></div></template><template id="reading-industry" data-title="风景背后，是生产与生活"><figure class="reading-hero"><img src="https://www.biei-hokkaido.jp/wp3/wp-content/uploads/2023/12/IMG_7059-scaled.jpg" alt="美瑛肯与玛丽之木及周边田野 · 夏季资料图" width="2560" height="1707" loading="lazy" decoding="async" referrerpolicy="no-referrer"><figcaption>美瑛肯与玛丽之木及周边田野 · 夏季资料图<small>图片：美瑛町观光协会</small></figcaption></figure><div class="reading-copy"><p class="reading-lead">从一片田地，看到北海道的生产与生活。</p><section class="reading-chapter"><h3>农业：土地与技术一起发挥作用</h3><p>2024年北海道耕地面积约113.8万公顷，占日本全国耕地面积的26.6%。稻作、旱田农业和奶业都是重要组成部分；小麦、马铃薯、甜菜、生乳等多种农畜产品的产量居日本前列。</p></section><section class="reading-chapter"><h3>从原料到加工与流通</h3><p>农业与渔业也延伸出食品加工：牛奶变成乳制品，农产和海产进入加工、冷链与销售环节。北海道政府的工业资料把食品制造列为当地工业出货额最大的类别。</p></section><section class="reading-chapter"><h3>制造业与新的发展方向</h3><p>北海道的产业并不只有农场和旅游。还有石油制品、钢铁等制造业，千岁一带也在推进新一代半导体相关产业。去美瑛看到的田地首先是正在经营的农业空间，观景时应留在允许通行的位置。</p></section><section class="reading-chapter"><h3>北海道的“好吃”背后，有一条生产链</h3><p>一杯牛奶背后有饲养、挤奶、冷却、运输和加工；一份海产背后有捕捞或养殖、分拣、保鲜和销售。食品制造把分散的农牧渔业与城市消费联系起来，这也是旅行中能在商店、工厂参观区和餐桌上不断遇见地方产品的原因。</p><p>近代农业还经历了适应寒冷环境的技术与品种改良。今天看到的田园并不是仅凭土地宽广就自然形成，而是长期劳动、设备投入和知识积累的结果。欣赏景观时，也是在看当地人的工作场所。</p></section><aside>配图为美瑛肯与玛丽之木周边田园。26.6%指2024年耕地面积占比，不是农业产值占比。</aside><p class="reading-source">资料：北海道政府《数据册2026·农业》；北海道政府《数据册2026·工业》；北海道政府《数据册2026·经济》；北海道政府《数据册2026·水产业》；北海道博物馆·北海道特色的秘密。核对：2026-10-15。</p><button class="reading-back-bottom">返回主题</button></div></template><template id="reading-culture" data-title="认识阿伊努：仍在延续的文化"><figure class="reading-hero"><img src="https://ainu-upopoy.go.jp/wp/wp-content/uploads/2026/04/urespa.png" alt="阿伊努生活文化 · Upopoy「くらし」章节资料图" width="1166" height="722" loading="lazy" decoding="async" referrerpolicy="no-referrer"><figcaption>阿伊努生活文化 · Upopoy「くらし」章节资料图<small>图片：Upopoy／公益财团法人阿伊努民族文化财团</small></figcaption></figure><div class="reading-copy"><p class="reading-lead">语言、手工艺与仍在延续的阿伊努文化。</p><section class="reading-chapter"><h3>阿伊努是谁</h3><p>阿伊努民族是日本列岛北部周边、尤其北海道的原住民族。他们发展出与日语不同的语言，以及口传、舞蹈、刺绣、木雕等文化表达。</p></section><section class="reading-chapter"><h3>自然观念与文化表达</h3><p>阿伊努文化中，对自然和万物的精神观念有重要地位。了解它时，不宜把不同地区的生活方式简化为一种固定服饰或装饰图案，也不要把当代阿伊努人只放在“古代历史”里。</p></section><section class="reading-chapter"><h3>在哪里继续了解</h3><p>北海道博物馆与白老的民族共生象征空间Upopoy，都是认识相关历史和文化的官方学习资源。这里先提供背景知识，不改变你们既定的札幌、旭川和美瑛行程。</p></section><section class="reading-chapter"><h3>传统会被传承，也会在今天变化</h3><p>口传故事、舞蹈、刺绣和木雕并非只有展柜里的固定形式。Upopoy介绍了复原传统舞蹈、创造新音乐等当代实践；文化传承既包括保存，也包括人们在今天继续使用和创造。</p><p>阿伊努人并不都从事传统工艺，也不是所有人都过同一种生活。现代职业、城市生活与文化身份可以同时存在。参观展示时，把“某一时期、某一地区或某项传统”与“所有阿伊努人”区分开，会更接近真实。</p></section><aside>配图来自Upopoy生活文化介绍；传统生活展示不能代表所有当代阿伊努人的日常生活。</aside><p class="reading-source">资料：Upopoy·关于阿伊努文化；北海道博物馆·阿伊努文化的世界。核对：2026-10-15。</p><button class="reading-back-bottom">返回主题</button></div></template></article></main>
