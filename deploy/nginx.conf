server {
    listen 80;
    server_name 120.26.54.152;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://120.26.54.152$request_uri; }
}
server {
    listen 443 ssl;
    server_name 120.26.54.152;
    ssl_certificate /etc/letsencrypt/live/hokkaido-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hokkaido-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    charset utf-8;
    location = /hokkaido { return 301 /hokkaido/; }
    location = /hokkaido/index.html { return 301 /hokkaido/; }
    location = /hokkaido/ {
        root /srv/hokkaido-family-map/dist;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }
    location / { return 404; }
}
