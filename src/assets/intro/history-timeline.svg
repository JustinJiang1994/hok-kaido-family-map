<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1070" viewBox="0 0 640 1070"><title>从近代转折，走到今天</title><rect width="640" height="1070" rx="18" fill="#eff5f0"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="50" font-size="32" fill="#193e42" font-weight="750">从近代转折，走到今天</text><text x="28" y="93" font-size="24" fill="#193e42" font-weight="500">城市 · 交通 · 自然保护 · 文化传承</text><path d="M46 138V968" stroke="#b8d2c8" stroke-width="5"/><circle cx="46" cy="145" r="9" fill="#ca6537"/><text x="72" y="153" font-size="29" fill="#9a532e" font-weight="750">1869</text><text x="72" y="192" font-size="25" fill="#193e42" font-weight="500">北海道命名；设立开拓使</text><circle cx="46" cy="243" r="9" fill="#ca6537"/><text x="72" y="251" font-size="29" fill="#9a532e" font-weight="750">1876—1888</text><text x="72" y="290" font-size="25" fill="#193e42" font-weight="500">农学校、铁路与红砖厅舍</text><circle cx="46" cy="341" r="9" fill="#ca6537"/><text x="72" y="349" font-size="29" fill="#9a532e" font-weight="750">1950</text><text x="72" y="388" font-size="25" fill="#193e42" font-weight="500">首届札幌雪祭</text><circle cx="46" cy="439" r="9" fill="#ca6537"/><text x="72" y="447" font-size="29" fill="#9a532e" font-weight="750">1971—1972</text><text x="72" y="486" font-size="25" fill="#193e42" font-weight="500">地铁开业；札幌冬奥会</text><circle cx="46" cy="537" r="9" fill="#ca6537"/><text x="72" y="545" font-size="29" fill="#9a532e" font-weight="750">1988</text><text x="72" y="584" font-size="25" fill="#193e42" font-weight="500">青函隧道通车；新千岁机场开港</text><circle cx="46" cy="635" r="9" fill="#ca6537"/><text x="72" y="643" font-size="29" fill="#9a532e" font-weight="750">2005</text><text x="72" y="682" font-size="25" fill="#193e42" font-weight="500">知床列入世界自然遗产</text><circle cx="46" cy="733" r="9" fill="#ca6537"/><text x="72" y="741" font-size="29" fill="#9a532e" font-weight="750">2016</text><text x="72" y="780" font-size="25" fill="#193e42" font-weight="500">北海道新干线首段开业</text><circle cx="46" cy="831" r="9" fill="#ca6537"/><text x="72" y="839" font-size="29" fill="#9a532e" font-weight="750">2020</text><text x="72" y="878" font-size="25" fill="#193e42" font-weight="500">Upopoy开放</text><circle cx="46" cy="929" r="9" fill="#ca6537"/><text x="72" y="937" font-size="29" fill="#9a532e" font-weight="750">2021</text><text x="72" y="976" font-size="25" fill="#193e42" font-weight="500">绳文遗址群列入世界文化遗产</text><text x="28" y="1030" font-size="20" fill="#193e42" font-weight="500">来源：北海道政府《数据册2026·历史年表》</text><text x="28" y="1058" font-size="20" fill="#193e42" font-weight="500">近代之前的文化与历史，见正文第一章。</text></g></svg>