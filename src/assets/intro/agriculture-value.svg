<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img"><title>2024年农业产出额前五地区比较</title><rect width="640" height="1000" rx="20" fill="#f0f5ef"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="50" font-size="31" fill="#193e42" font-weight="750">农业产出额：主要地区逐一比较</text><text x="28" y="92" font-size="23" fill="#193e42" font-weight="500">2024年都道府县推计；全国前五位</text><text x="28" y="133" font-size="26" fill="#193e42" font-weight="700">47个都道府县合计 108,200 亿日元</text><text x="28" y="174" font-size="23" fill="#193e42" font-weight="500">地区与数值                         全国占比</text><text x="28" y="222" font-size="27" fill="#193e42" font-weight="700">北海道</text><text x="325" y="222" font-size="25" fill="#193e42" font-weight="500">14,817 亿日元</text><rect x="28" y="239" width="88.643" height="28" rx="4" fill="#236e67"/><text x="490" y="262" font-size="27" fill="#193e42" font-weight="700">13.7%</text><text x="28" y="314" font-size="27" fill="#193e42" font-weight="700">鹿儿岛县</text><text x="325" y="314" font-size="25" fill="#193e42" font-weight="500">5,689 亿日元</text><rect x="28" y="331" width="34.034" height="28" rx="4" fill="#617b99"/><text x="490" y="354" font-size="27" fill="#193e42" font-weight="700">5.3%</text><text x="28" y="406" font-size="27" fill="#193e42" font-weight="700">茨城县</text><text x="325" y="406" font-size="25" fill="#193e42" font-weight="500">5,494 亿日元</text><rect x="28" y="423" width="32.868" height="28" rx="4" fill="#617b99"/><text x="490" y="446" font-size="27" fill="#193e42" font-weight="700">5.1%</text><text x="28" y="498" font-size="27" fill="#193e42" font-weight="700">千叶县</text><text x="325" y="498" font-size="25" fill="#193e42" font-weight="500">4,533 亿日元</text><rect x="28" y="515" width="27.119" height="28" rx="4" fill="#617b99"/><text x="490" y="538" font-size="27" fill="#193e42" font-weight="700">4.2%</text><text x="28" y="590" font-size="27" fill="#193e42" font-weight="700">青森县</text><text x="325" y="590" font-size="25" fill="#193e42" font-weight="500">4,119 亿日元</text><rect x="28" y="607" width="24.642" height="28" rx="4" fill="#617b99"/><text x="490" y="630" font-size="27" fill="#193e42" font-weight="700">3.8%</text><text x="28" y="682" font-size="27" fill="#193e42" font-weight="700">其余42个都府县</text><text x="325" y="682" font-size="25" fill="#193e42" font-weight="500">73,548 亿日元</text><rect x="28" y="699" width="440.000" height="28" rx="4" fill="#b6c2ce"/><text x="490" y="722" font-size="27" fill="#193e42" font-weight="700">68.0%</text><text x="28" y="820" font-size="22" fill="#193e42" font-weight="500">具名地区为全国前五位。</text><text x="28" y="852" font-size="22" fill="#193e42" font-weight="500">其余42个都府县包括熊本、宫崎、新潟等。</text><text x="28" y="884" font-size="22" fill="#193e42" font-weight="500">占比以47地合计为分母，不是全国独立推计。</text><text x="28" y="940" font-size="20" fill="#193e42" font-weight="500">来源：农林水产省2024年农业产出额统计</text><text x="28" y="974" font-size="19" fill="#193e42" font-weight="500">占比按公布值计算并四舍五入；面积不等于产值。</text></g></svg>